name: Smoke Tests

on:
  pull_request:
    branches: [prod, dev]
  push:
    branches: [dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mixarr_test
          MYSQL_USER: mixarr
          MYSQL_PASSWORD: mixarr
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mysql://mixarr:mixarr@127.0.0.1:3306/mixarr_test
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: smoke-test-secret
      NODE_ENV: test
      CI: true
      API_URL: http://127.0.0.1:3005
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push schema to test DB
        run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Build API and web
        run: |
          npm run build --workspace=@mixarr/api
          npm run build --workspace=@mixarr/web

      - name: Install Playwright browsers
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Start API server
        run: |
          PORT=3005 NODE_ENV=production npm run start --workspace=@mixarr/api > /tmp/api.log 2>&1 &

      - name: Start web frontend
        run: |
          NODE_ENV=production npm run start --workspace=@mixarr/web > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          echo "Waiting for API..."
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:3005/api/health > /dev/null; do sleep 2; done' \
            || { echo "=== API startup log ==="; cat /tmp/api.log; exit 1; }
          echo "API is ready!"

          echo "Waiting for frontend..."
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:3000 > /dev/null; do sleep 2; done' \
            || { echo "=== Web startup log ==="; cat /tmp/web.log; exit 1; }
          echo "Frontend is ready!"

      - name: Run smoke tests
        run: |
          cd apps/web
          npx playwright test e2e/theme.spec.ts --project=chromium --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7
