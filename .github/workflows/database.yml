name: Database Migrations

on:
  # Containers migrate their own databases at upgrade time. This optional job
  # is only for an operator-managed external database with a production secret.
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  migrate-production:
    name: Migrate Production Database
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Require an explicitly configured external database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Configure the production DATABASE_URL secret before dispatching an external migration."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy checked migrations
        run: npm run db:deploy --workspace=@mixarr/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

