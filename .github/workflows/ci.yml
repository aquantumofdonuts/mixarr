name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint changed API source files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- ':(glob)apps/api/src/**/*.ts')
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No API TypeScript source files changed"
            exit 0
          fi

          echo "$CHANGED_FILES" | xargs npx eslint

      - name: Verify release publication guard
        run: node --test scripts/verify-release.test.cjs

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mixarr_test
          MYSQL_USER: mixarr
          MYSQL_PASSWORD: mixarr
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: mysql://mixarr:mixarr@127.0.0.1:3306/mixarr_test
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: test-session-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy migrations to test DB
        run: npm run db:deploy --workspace=@mixarr/api

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build all packages
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/prod'
    strategy:
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/mixarr-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release-schema:
    name: Release migration safety
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mixarr_upgrade_test
        ports:
          - 13316:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Verify released v2 schemas and legacy migration safety
        working-directory: apps/api
        run: npx vitest run tests/scripts/deploy-schema.database.test.ts
        env:
          RELEASE_UPGRADE_TEST_DATABASE_URL: mysql://root@127.0.0.1:13316/mixarr_upgrade_test

  release-images:
    name: Release image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [unified, slim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Build published variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.variant }}
          load: true
          push: false
          tags: mixarr-release-check:${{ matrix.variant }}
          cache-from: type=gha,scope=release-check-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=release-check-${{ matrix.variant }}
      - name: Rehearse released v2 schemas, restart and fresh install
        run: |
          for version in v2.0.0 v2.2.0 v2.3.5; do
            bash scripts/release-upgrade-smoke.sh '${{ matrix.variant }}' 'mixarr-release-check:${{ matrix.variant }}' "$version"
          done
